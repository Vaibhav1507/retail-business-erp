          psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE rbos_migrator PASSWORD 'ci_migrator_only_2026'; ALTER ROLE rbos_app PASSWORD 'ci_app_only_2026'; ALTER ROLE rbos_worker PASSWORD 'ci_worker_only_2026';"

      - name: Build API
        run: dotnet build RetailBusinessOs.slnx --nologo -c Release

