name: rbos-ci

on:
  pull_request:
  push:
    branches: [main, feature/whatsapp-invoice-pilot]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build RetailBusinessOs.slnx --nologo -c Release
      - name: Run backend unit tests
        run: dotnet test tests/Rbos.UnitTests/Rbos.UnitTests.csproj --nologo -c Release --no-build
      # PostgreSQL integration tests and Playwright E2E remain disabled until their
      # database/browser service fixtures are restored as explicit CI dependencies.
      - name: Build deployment container (no push)
        run: docker build --pull -t retail-business-os:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Temporarily disabled with backend unit/integration and Playwright E2E tests.
      # Re-enable npm test when the temporary CI test bypass is lifted.
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit (high and critical vulnerabilities fail CI)
        run: npm run audit:ci
