name: rbos-ci

on:
  pull_request:
  push:
    branches: [main, feature/whatsapp-invoice-pilot]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build RetailBusinessOs.slnx --nologo -c Release
      # Temporarily disabled while invoice extraction / AI Gateway CI is stabilized:
      # - dotnet test RetailBusinessOs.slnx --nologo -c Release --no-build
      # - Playwright browser E2E (npm run test:e2e)
      # Re-enable tests, PostgreSQL service/bootstrap, Noto fonts and Playwright
      # browser installation together when the test suite is ready to gate merges.
      - name: Build deployment container (no push)
        run: docker build --pull -t retail-business-os:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit (high and critical vulnerabilities fail CI)
        run: npm run audit:ci
