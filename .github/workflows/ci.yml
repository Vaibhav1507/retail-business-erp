name: rbos-ci

on:
  pull_request:
  push:
    branches: [main, feature/whatsapp-invoice-pilot, fix/e2e-product-creation-diagnostics]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-superuser-only
      ConnectionStrings__RbosTestMigrator: Host=localhost;Database=rbos_test;Username=rbos_migrator;Password=ci-migrator-pass
      ConnectionStrings__RbosTestApp: Host=localhost;Database=rbos_test;Username=rbos_app;Password=ci-app-pass
      ConnectionStrings__RbosTestWhatsAppWorker: Host=localhost;Database=rbos_test;Username=rbos_worker;Password=ci-worker-pass
    steps:
      - uses: actions/checkout@v4
      - name: Install Noto fonts for Unicode PDF tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install synthetic E2E dependencies and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Create roles and databases (throwaway CI database, synthetic passwords)
        run: |
          psql -h localhost -U postgres -d postgres -f scripts/database/bootstrap-postgresql.sql
          psql -h localhost -U postgres -d postgres -c "ALTER ROLE rbos_migrator PASSWORD 'ci-migrator-pass'" -c "ALTER ROLE rbos_app PASSWORD 'ci-app-pass'" -c "ALTER ROLE rbos_worker PASSWORD 'ci-worker-pass'"
      - run: dotnet build RetailBusinessOs.slnx --nologo -c Release
      - run: dotnet run --project src/Rbos.Api -c Release --no-build -- --migrate test
      - run: dotnet test RetailBusinessOs.slnx --nologo -c Release --no-build
      - name: Run synthetic one-shop browser E2E against disposable test database
        working-directory: web
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Rbos__Database: test
          Rbos__AllowOpenRegistration: 'true'
        run: npm run test:e2e
      - name: Upload Playwright failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-diagnostics
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build deployment container (no push)
        run: docker build --pull -t retail-business-os:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit (high and critical vulnerabilities fail CI)
        run: npm run audit:ci
